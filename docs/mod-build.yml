# Шаблон workflow для репозитория с модом (NeoForge 1.21.1).
# Положи как .github/workflows/build.yml в репозиторий МОДА (не программы).
name: build

on:
  workflow_dispatch:   # нужен, чтобы Mod Builder мог запускать сборку
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
