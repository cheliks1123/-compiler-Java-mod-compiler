# Шаблон workflow для репозитория с проектом на C++ (CMake).
# Положи как .github/workflows/build.yml в репозиторий ПРОЕКТА (не программы Mod Builder).
# Собирает под Windows (MSVC) и Linux (gcc) одновременно: ошибки обоих компиляторов
# попадут во вкладку «Проблемы». Если нужен только один, удали лишнюю строку из matrix.
name: build

on:
  workflow_dispatch:   # нужен, чтобы Mod Builder мог запускать сборку
  push:

jobs:
  build:
    strategy:
      fail-fast: false   # упавшая сборка одной ОС не обрывает вторую, видны все ошибки
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        continue-on-error: true   # если тестов нет, сборка не падает

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/Release/*.lib
            build/*.exe
            build/[a-zA-Z]*
            !build/CMakeFiles
            !build/CMakeCache.txt
            !build/cmake_install.cmake
            !build/Makefile
            !build/_deps
          if-no-files-found: warn
