plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.comfythirdperson'

repositories {
    mavenLocal()
}

base {
    archivesName = 'comfythirdperson'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'

    // accesstransformer.cfg из META-INF подхватывается автоматически
    runs {
        client {
            client()
        }
    }

    mods {
        comfythirdperson {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
