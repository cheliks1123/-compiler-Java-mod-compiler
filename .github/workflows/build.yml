name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-14
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Сборка
        run: cmake --build build --config Release --parallel

      # ---------- Упаковка ----------
      - name: Упаковка (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp build/libget_gui dist/
          tar -czf LibGet-Linux.tar.gz -C dist .

      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/libget_gui.exe dist/
          windeployqt --release --no-translations dist/libget_gui.exe
          Compress-Archive -Path dist/* -DestinationPath LibGet-Windows.zip

      - name: Упаковка (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/libget_gui.app
          ditto -c -k --sequesterRsrc --keepParent build/libget_gui.app LibGet-macOS.zip

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: LibGet-${{ matrix.name }}
          path: |
            LibGet-Linux.tar.gz
            LibGet-Windows.zip
            LibGet-macOS.zip
          if-no-files-found: error

  release:
    name: Релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
